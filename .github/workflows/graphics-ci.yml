name: P2 WebGL graphics validation

on:
  push:
    branches: [feat/graphics-p2-webgl-city]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graphics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks for simulation and graphics
        run: |
          node --check engine.js
          node --check p0.js
          node --check game.js
          node --check graphics-model.js
          node --check graphics3d.mjs
      - name: Deterministic simulation and visual geometry
        run: |
          node tests/smoke.cjs
          node tests/p0.cjs
          node tests/p01.cjs
          node tests/graphics.cjs
          node tests/ui-smoke.cjs
      - name: Install Chrome for browser integration
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
      - name: Install Playwright automation library
        run: npm install --no-save --no-package-lock playwright-core@1.55.0
      - name: Browser integration and screenshot
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/graphics-browser.cjs
      - name: Upload browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metropole-webgl-browser
          path: artifacts/graphics-browser.png
          if-no-files-found: ignore
