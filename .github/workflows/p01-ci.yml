name: P0.1 regression checks

on:
  push:
    branches:
      - fix/p0-1-stability-saves-regressions
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check engine.js
          node --check p0.js
          node --check game.js
      - name: City simulation and UI tests
        run: |
          node tests/smoke.cjs
          node tests/p0.cjs
          node tests/p01.cjs
          node tests/ui-smoke.cjs
